name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to package (e.g. v1.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK platform
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          export ANDROID_HOME ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found under $ANDROID_HOME" >&2
            ls -la "$ANDROID_HOME" >&2 || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37" "platform-tools"
      - name: Package APKs
        run: |
          VERSION="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          chmod +x gradlew scripts/build-release.sh
          ./scripts/build-release.sh "$VERSION"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: sandglass ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/SHA256SUMS
          body: |
            Android: download `sandglass-*-android-universal-debug.apk` (any device) or the smaller `sandglass-*-android-arm64-v8a-debug.apk` for 64-bit phones. Enable install from unknown sources, then open the APK. These builds are debug-signed for sideloading; they are not Play Store / Play App Signing builds.
